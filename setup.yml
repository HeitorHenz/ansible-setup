- name: Setup Arch Linux
  hosts: localhost
  connection: local

  vars:
    home_dir: "{{ ansible_facts['user_dir'] }}"

    system_packages:
      - git
      - rustup
      - fish
      - helix
      - stow
      - flatpak
      - ttf-fira-code
      - podman
      - podman-compose
      - eza
      - bat
      - ripgrep
      - starship
      - zoxide
      - zellij
      - ghostty
      - libfreeaptx
      - libldac
      - pipewire-audio
      - libsecret
      - gnome-keyring
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk
      - zed
      - wl-clipboard
      - fastfetch
      - matugen
      - uv
      - ttf-firacode-nerd
      - dux-shell
      - dux-gop
      - gnupg
      - pinentry
    aur_packages:
      - dux-files-bin
      - dux-search-bin
      - dux-calendar-bin
      - dux-greeter-bin
    flatpak_apps:
      - md.obsidian.Obsidian
      - io.github.kolunmi.Bazaar
    uv_tools:
      - ruff
      - ty

  tasks:
    # Packages
    - name: Install System Packages
      become: true
      community.general.pacman:
        name: "{{ system_packages }}"
        state: present
        update_cache: true
      register: pacman_result
      until: pacman_result is not failed
      retries: 3
      delay: 5

    - name: Install AUR packages
      ansible.builtin.command:
        cmd: "yay -S --needed --noconfirm {{ aur_packages | join(' ') }}"
      become: false
      register: aur_install
      changed_when: "'installing' in aur_install.stdout or 'upgrading' in aur_install.stdout"
      until: aur_install is not failed
      retries: 3
      delay: 5

    # uv tools
    - name: Install uv tools
      ansible.builtin.command:
        cmd: "uv tool install {{ item }}"
        creates: "{{ home_dir }}/.local/bin/{{ item }}"
      loop: "{{ uv_tools }}"
      register: uv_install
      until: uv_install is not failed
      retries: 3
      delay: 5

    # Flathub
    - name: Enable Flathub Repository
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
      register: flathub_remote
      until: flathub_remote is not failed
      retries: 3
      delay: 5

    - name: Install Flatpak Applications
      community.general.flatpak:
        name: "{{ flatpak_apps }}"
        remote: flathub
        state: present
      register: flatpak_apps_result
      until: flatpak_apps_result is not failed
      retries: 3
      delay: 5

    # Conf
    - name: Clone dotfiles
      ansible.builtin.git:
        repo: "https://github.com/HeitorHenz/.dotfiles"
        dest: "{{ home_dir }}/.dotfiles"
        update: true
      register: clone_result
      until: clone_result is not failed
      retries: 3
      delay: 5

    # Stow
    - name: Check for conflicting default files
      ansible.builtin.stat:
        path: "{{ home_dir }}/{{ item }}"
      loop:
        - .bashrc
        - .bash_profile
        - .config/hypr/hyprland.conf
        - .config/zed/settings.json
      register: stow_conflicts

    - name: Remove conflicting files if they are real files (not links)
      ansible.builtin.file:
        path: "{{ home_dir }}/{{ item.item }}"
        state: absent
      loop: "{{ stow_conflicts.results }}"
      when: item.stat.exists and not item.stat.islnk

    - name: Find all dotfile directories
      ansible.builtin.find:
        paths: "{{ home_dir }}/.dotfiles"
        file_type: directory
        recurse: false
        hidden: true
        patterns: ['*']
        excludes: ['.git']
      register: dotfile_dirs

    - name: Run Stow
      ansible.builtin.command:
        cmd: "stow -v {{ dotfile_dirs.files | map(attribute='path') | map('basename') | join(' ') }}"
        chdir: "{{ home_dir }}/.dotfiles"
      register: stow_result
      changed_when: "'LINK:' in stow_result.stderr"
      when: dotfile_dirs.files | length > 0

    # Fish
    - name: Set fish as the default shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /usr/bin/fish

    - name: Ensure ~/.gnupg exists
      ansible.builtin.file:
        path: "{{ home_dir }}/.gnupg"
        state: directory
        mode: "0700"

    - name: Pin gpg-agent to pinentry-qt
      ansible.builtin.copy:
        dest: "{{ home_dir }}/.gnupg/gpg-agent.conf"
        mode: "0600"
        content: |
          pinentry-program /usr/bin/pinentry-qt
          no-allow-external-cache
          default-cache-ttl 28800
          max-cache-ttl 28800

    - name: Enable Dux user services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        scope: user
      loop:
        - dms.service
        - dfiles.service
        - dsearch.service

    - name: Enable gnome-keyring auto-unlock in greetd
      become: true
      ansible.builtin.lineinfile:
        path: /etc/pam.d/greetd
        line: "{{ item }}"
        backup: true
      loop:
        - "auth       optional     pam_gnome_keyring.so"
        - "session    optional     pam_gnome_keyring.so auto_start"

    - name: Default file manager for directories
      community.general.xdg_mime:
        mime_types:
          - inode/directory
        handler: dev.duxlabs.files.desktop
