- name: Setup Arch Linux
  hosts: localhost
  connection: local

  vars:
    home_dir: "{{ ansible_user_dir }}"

    system_packages:
      - git
      - rustup
      - fish
      - helix
      - stow
      - flatpak
      - ttf-fira-code
      - podman
      - podman-compose
      - eza
      - bat
      - ripgrep
      - starship
      - zoxide
      - zellij
      - gnome-keyring
      - ghostty
      - libfreeaptx
      - libldac
      - pipewire-audio
      - libsecret
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk
      - zed
      - hyprshot
    flatpak_apps:
      - md.obsidian.Obsidian
      - io.github.kolunmi.Bazaar
    uv_tools:
      - ruff
      - ty

  tasks:
    - name: Pacman conf customization
      become: true
      community.general.ini_file:
        path: /etc/pacman.conf
        section: options
        option: "{{ item.option }}"
        value: "{{ item.value | default(omit) }}"
        allow_no_value: "{{ item.no_value | default(false) }}"
        state: present
        backup: yes
      loop:
        - { option: 'Color', no_value: true }
        - { option: 'ParallelDownloads', value: '5' }

    # Packages
    - name: Install System Packages
      become: true
      community.general.pacman:
        name: "{{ system_packages }}"
        state: present
        update_cache: yes
      register: pacman_result
      until: pacman_result is not failed
      retries: 3
      delay: 5

    # uv tools
    - name: Install uv tools
      ansible.builtin.command:
        cmd: "uv tool install {{ item }}"
        creates: "{{ home_dir }}/.local/bin/{{ item }}"
      loop: "{{ uv_tools }}"
      register: uv_install
      until: uv_install is not failed
      retries: 3
      delay: 5

    # Flathub
    - name: Enable Flathub Repository
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
      register: flathub_remote
      until: flathub_remote is not failed
      retries: 3
      delay: 5

    - name: Install Flatpak Applications
      community.general.flatpak:
        name: "{{ flatpak_apps }}"
        remote: flathub
        state: present
      register: flatpak_apps_result
      until: flatpak_apps_result is not failed
      retries: 3
      delay: 5

    # Conf
    - name: Clone dotfiles
      ansible.builtin.git:
        repo: "https://github.com/HeitorHenz/.dotfiles"
        dest: "{{ home_dir }}/.dotfiles"
        update: yes
      register: clone_result
      until: clone_result is not failed
      retries: 3
      delay: 5

    # Stow
    - name: Check for conflicting default files
      ansible.builtin.stat:
        path: "{{ home_dir }}/{{ item }}"
      loop:
        - .bashrc
        - .bash_profile
        - .config/hypr/hyprland.conf
        - .config/zed/settings.json
      register: stow_conflicts

    - name: Remove conflicting files if they are real files (not links)
      ansible.builtin.file:
        path: "{{ home_dir }}/{{ item.item }}"
        state: absent
      loop: "{{ stow_conflicts.results }}"
      when: item.stat.exists and not item.stat.islnk

    - name: Find all dotfile directories
      ansible.builtin.find:
        paths: "{{ home_dir }}/.dotfiles"
        file_type: directory
        recurse: no
        hidden: true
        patterns: ['*']
        excludes: ['.git']
      register: dotfile_dirs

    - name: Run Stow
      ansible.builtin.command:
        cmd: "stow -v {{ dotfile_dirs.files | map(attribute='path') | map('basename') | join(' ') }}"
        chdir: "{{ home_dir }}/.dotfiles"
      register: stow_result
      changed_when: "'LINK:' in stow_result.stderr"
      when: dotfile_dirs.files | length > 0

    # Fish
    - name: Set fish as the default shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/fish
